<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BacWay</title>
<style>
:root{--bg:#fbfbfd;--ink:#1d1d1f;--mut:#6e6e73;--card:rgba(255,255,255,.58);--ac:#0071e3;--ac2:#ff9f0a;--ln:rgba(120,130,160,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b12;--ink:#f5f5f7;--mut:#a1a1aa;--card:rgba(255,255,255,.07);--ln:rgba(255,255,255,.14)}:root:not([data-theme=light]) .card{border-color:rgba(255,255,255,.12)}}
:root[data-theme=dark]{--bg:#0b0b12;--ink:#f5f5f7;--mut:#a1a1aa;--card:rgba(255,255,255,.07);--ln:rgba(255,255,255,.14)}:root[data-theme=dark] .card{border-color:rgba(255,255,255,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(60% 50% at 15% 0%,rgba(0,113,227,.16),transparent),radial-gradient(50% 45% at 90% 10%,rgba(191,90,242,.15),transparent),radial-gradient(60% 50% at 50% 100%,rgba(255,159,10,.13),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 -apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
h1,h2,h3,button,.sans{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px}
nav{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 20px;max-width:980px;margin:auto}
.logo{font:800 22px system-ui;letter-spacing:-.5px}.logo b{color:var(--ac)}
select,input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
button{cursor:pointer;border:0;border-radius:980px;padding:11px 20px;font-weight:600;background:var(--ac);color:#fff;font-size:15px;box-shadow:0 6px 18px rgba(0,113,227,.28);transition:transform .2s}button:active{transform:scale(.97)}
button.g{background:var(--card);color:var(--ink);border:1px solid var(--ln)}button:disabled{opacity:.5}
.hero{position:relative;overflow:hidden;text-align:center;padding:70px 10px 50px}
.hero h1{font-size:clamp(40px,9vw,80px);line-height:1.04;margin:0 0 16px;letter-spacing:-2.5px;background:linear-gradient(120deg,var(--ink) 20%,#0071e3 55%,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 span{color:var(--ac);display:inline-block;animation:fl 5s ease-in-out infinite}
.hero p{color:var(--mut);font-size:19px;max-width:560px;margin:0 auto 26px;font-style:italic}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35;z-index:-1;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.path{display:flex;gap:0;justify-content:center;flex-wrap:wrap;margin:30px 0}
.path div{background:var(--card);border:1px solid var(--ln);padding:12px 16px;margin:6px;border-radius:40px;font:600 14px system-ui;animation:fl 6s ease-in-out infinite}
.path div:nth-child(2n){animation-delay:-2s}.path div:nth-child(3n){animation-delay:-4s}
.card{background:var(--card);border:1px solid rgba(255,255,255,.65);border-radius:28px;padding:20px;margin:14px 0;backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 40px rgba(30,40,90,.10);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.card:hover{transform:translateY(-2px)}.path div,.tabs button,.opt{backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);background:var(--card);border-radius:0 0 26px 26px}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--ln);white-space:nowrap}.tabs button.on{background:var(--ink);color:var(--bg)}
.chap{cursor:pointer}.chap:hover{border-color:var(--ac)}
.opt{display:block;width:100%;text-align:start;background:var(--bg);color:var(--ink);border:1px solid var(--ln);margin:6px 0}.opt.sel{border-color:var(--ac);background:var(--card);outline:2px solid var(--ac)}
.tag{font:600 12px system-ui;padding:3px 9px;border-radius:20px;background:var(--ac);color:#fff}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%;white-space:pre-wrap}.u{background:var(--ac);color:#fff;margin-inline-start:auto}.a{background:var(--card);border:1px solid var(--ln)}
.fc{perspective:700px;cursor:pointer}.fc div{padding:20px;min-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:16px;background:var(--bg);border:2px dashed var(--ac)}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.hid{display:none}.mut{color:var(--mut)}
[dir=rtl] .hero p{font-style:normal}
</style></head><body>
<nav><div class="logo">Bac<b>Way</b> ✦</div><div style="display:flex;gap:8px;width:220px"><select id="lg" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div></nav>
<div class="wrap" id="app"></div>
<script>
const T={en:{t:"The path to the Bac, with motion.",s:"A calm place to understand, train and grow — guided by a coach that learns how your brain works.",go:"Start my path",vd:"Video script (10 min)",n:"Your name",lv:"Your level",sec:"Your section",gen:"I am a",gi:"Girl",bo:"Boy",nx:"Continue",q:"Your learning profile",wk:"Describe your week: school hours, sports, free time",hi:"Home",su:"Subjects",co:"Coach",pl:"My plan",ye:"School year",pt:"Pre-test",ch:"Chapters",send:"Send",ask:"Ask your coach anything…",run:"Start the pre-test (easy → hard)",fin:"Finish & analyse",fl:"Flashcards",dl:"Download printable summary",gp:"Build my full weekly plan",hello:"Welcome",left:"days left until the Bac (approx. early June)",bk:"Back",load:"Your coach is thinking…",nf:"The AI coach is temporarily unavailable. Please try again.",ph:"Philosophy corner",yr:"School year in Tunisia: classes run from mid‑September to May, with weekends and school holidays off (autumn, winter, spring). Check the official calendar of the Ministry of Education for exact dates. The Bac main session is usually in early June."},
fr:{t:"Le chemin vers le Bac, en mouvement.",s:"Un lieu calme pour comprendre, s’entraîner et progresser — avec un coach qui apprend comment fonctionne ton cerveau.",go:"Commencer mon parcours",vd:"Script vidéo (10 min)",n:"Ton prénom",lv:"Ton niveau",sec:"Ta section",gen:"Je suis",gi:"Fille",bo:"Garçon",nx:"Continuer",q:"Ton profil d’apprentissage",wk:"Décris ta semaine : cours, sport, temps libre",hi:"Accueil",su:"Matières",co:"Coach",pl:"Mon plan",ye:"Année scolaire",pt:"Pré-test",ch:"Chapitres",send:"Envoyer",ask:"Pose ta question au coach…",run:"Lancer le pré-test (facile → difficile)",fin:"Terminer et analyser",fl:"Cartes mémoire",dl:"Télécharger le résumé imprimable",gp:"Créer mon planning hebdomadaire",hello:"Bienvenue",left:"jours avant le Bac (approx. début juin)",bk:"Retour",load:"Le coach réfléchit…",nf:"Le coach IA est momentanément indisponible. Réessaie.",ph:"Coin philosophie",yr:"Année scolaire en Tunisie : cours de mi‑septembre à mai, week‑ends et vacances scolaires (automne, hiver, printemps) sans cours. Consulte le calendrier officiel du ministère. La session principale du Bac a lieu généralement début juin."},
ar:{t:"الطريق إلى الباكالوريا، بحركة وجمال.",s:"مكان هادئ للفهم والتدرب والتقدم، مع مدرّب يتعلم كيف يعمل دماغك.",go:"ابدأ طريقي",vd:"نص فيديو (10 دقائق)",n:"اسمك",lv:"مستواك",sec:"شعبتك",gen:"أنا",gi:"بنت",bo:"ولد",nx:"متابعة",q:"ملفك التعليمي",wk:"صف أسبوعك: الدراسة، الرياضة، أوقات الفراغ",hi:"الرئيسية",su:"المواد",co:"المدرّب",pl:"خطتي",ye:"السنة الدراسية",pt:"اختبار تشخيصي",ch:"الدروس",send:"إرسال",ask:"اسأل مدرّبك أي شيء…",run:"ابدأ الاختبار (من السهل إلى الصعب)",fin:"إنهاء وتحليل",fl:"بطاقات المراجعة",dl:"تحميل الملخص للطباعة",gp:"أنشئ خطتي الأسبوعية",hello:"مرحبا",left:"يوما على الباكالوريا (تقريبا بداية جوان)",bk:"رجوع",load:"المدرّب يفكر…",nf:"المدرّب الذكي غير متاح مؤقتا. حاول مرة أخرى.",ph:"ركن الفلسفة",yr:"السنة الدراسية في تونس: الدروس من منتصف سبتمبر إلى ماي مع عطل نهاية الأسبوع والعطل المدرسية. راجع روزنامة وزارة التربية للتواريخ الدقيقة. الدورة الرئيسية للباكالوريا عادة في بداية جوان."}};
const SEC={math:{Maths:["Limits & continuity","Derivatives","Sequences","Logarithm","Exponential","Integrals","Complex numbers","Probability","Arithmetic","Space geometry"],Physics:["Oscillations RLC","Mechanical waves","Light waves","Nuclear physics","Capacitor & coil","Newton laws"],Chemistry:["Reaction rates","Equilibrium","Acids & bases","Cells & electrolysis"],SVT:["Genetics","Immunity","Nerve & muscle","Reproduction"],Philosophy:["Freedom","Truth","Knowledge","Consciousness"],Arabic:["Grammar","Literature","Essay writing"],French:["Text analysis","Argumentation"],English:["Writing","Grammar","Reading"]},
sciences:{Maths:["Limits","Derivatives","Sequences","Logarithm","Exponential","Probability"],SVT:["Genetics","Immunity","Nerve & muscle","Reproduction","Geology"],Physics:["Oscillations","Waves","Nuclear physics"],Chemistry:["Equilibrium","Acids & bases"],Philosophy:["Freedom","Truth","Knowledge"],Arabic:["Grammar","Essay"],French:["Text analysis"],English:["Writing","Grammar"]},
eco:{Economics:["Market","Growth","Money & banks","International trade"],Management:["Accounting","Financial analysis"],Maths:["Functions","Sequences","Statistics"],Geography:["Globalisation","Regions"],History:["Contemporary world"],Philosophy:["Freedom","Truth"],Arabic:["Grammar","Essay"],French:["Argumentation"],English:["Writing"]},
tech:{Technology:["Mechanical design","Electrical systems","Manufacturing","Automation"],Maths:["Limits","Derivatives","Complex numbers","Integrals"],Physics:["Electricity","Mechanics","Waves"],Philosophy:["Freedom","Truth"],Arabic:["Grammar","Essay"],French:["Text analysis"],English:["Writing"]},
info:{Algorithmics:["Algorithms","Arrays & strings","Recursion","Sorting & search"],Databases:["Relational model","SQL"],Maths:["Limits","Derivatives","Sequences","Arithmetic","Probability"],Physics:["Electricity","Waves"],Philosophy:["Freedom","Truth"],Arabic:["Grammar","Essay"],French:["Text analysis"],English:["Writing"]}};
const SN={math:"Mathematics",sciences:"Experimental sciences (SVT)",eco:"Economics & Management",tech:"Technical sciences",info:"Computer science"};
const QZ=[["Where do you study best?",["Quiet room","Library","With friends","With music"]],["How many hours do you study daily?",["< 1h","1–2h","3–4h","> 4h"]],["Your sleep?",["< 6h","6–7h","7–8h","> 8h"]],["Biggest obstacle?",["Focus","Motivation","Understanding","Stress / fear of exams"]],["Family support for studies?",["Very supportive","Supportive","Neutral","Little"]],["Pressure from your family?",["Too much","Some","Balanced","None"]]];
const REL=["Close and warm","Good but distant","Tense","Almost no contact"];
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let P={},S={lang:"en",step:0,tab:"hi",chat:[],q:{}},smp=null;
try{P=JSON.parse(localStorage.getItem("bw")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("bw",JSON.stringify(P))}catch(e){}};
const t=k=>T[S.lang][k]||T.en[k];
async function ai(prompt,json){try{const m=Array.isArray(prompt)?prompt:[{role:"user",content:prompt+(json?"\n\nReturn ONLY valid JSON, no markdown fences.":"")}];const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:m})});if(!r.ok)throw 0;const x=(await r.json()).text;return json?JSON.parse(x.replace(/```json|```/g,"").trim()):x}catch(e){return null}}
function ctx(){return `Student profile: ${JSON.stringify({name:P.name,level:P.level,section:SN[P.sec],gender:P.gen,quiz:P.quiz,family:P.rel,week:P.week,weak:P.weak})}. Reply in ${{en:"English",fr:"French",ar:"Arabic"}[S.lang]}. Tunisian curriculum. You are an expert tutor with knowledge of cognitive psychology and neuroscience (spaced repetition, retrieval practice, sleep, stress regulation). Be warm, concrete, concise.`}
function setLang(l){S.lang=l;document.documentElement.lang=l;document.documentElement.dir=l=="ar"?"rtl":"ltr";P.lang=l;save();render()}
$("#lg").onchange=e=>setLang(e.target.value);
function render(){const a=$("#app");$("#lg").value=S.lang;
if(!P.done){S.step==0?home(a):onboard(a)}else dash(a)}
function home(a){a.innerHTML=`<div class="hero"><div class="blob" style="width:300px;height:300px;background:#7dd3fc;top:-60px;left:5%"></div><div class="blob" style="width:260px;height:260px;background:#f0abfc;bottom:-40px;right:8%"></div><h1>${esc(t("t"))}</h1><p>${esc(t("s"))}</p><button id="go" style="font-size:18px;padding:14px 28px">${t("go")} →</button></div>
<div class="path"><div>🧠 Profile</div><div>🎯 Pre-test</div><div>📘 Adaptive course</div><div>🗂 Flashcards</div><div>📄 Printable PDF</div><div>📅 Weekly plan</div><div>🏆 Bac</div></div>
<div class="card sans mut" style="text-align:center">${[["The unexamined life is not worth living.","Socrates"],["Know thyself.","Delphi"],["I think, therefore I am.","Descartes"]][Date.now()%3].map((x,i)=>i?"— "+x:"“"+x+"”").join(" ")}</div>`;$("#go").onclick=()=>{S.step=1;render()}}
function onboard(a){const s=S.step;
if(s==1){a.innerHTML=`<h2>${t("hello")} ✦</h2><div class="card"><label>${t("n")}</label><input id="nm" value="${esc(P.name||"")}"><br><br><label>${t("lv")}</label><select id="lv"><option value="Bac">Bac (4ème)</option><option value="3ème">3ème</option></select><br><br><label>${t("sec")}</label><select id="sc">${Object.entries(SN).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><br><br><label>${t("gen")}</label><select id="gn"><option value="girl">${t("gi")}</option><option value="boy">${t("bo")}</option></select><br><br><button id="nx">${t("nx")}</button></div>`;
$("#nx").onclick=()=>{P.name=$("#nm").value||"Student";P.level=$("#lv").value;P.sec=$("#sc").value;P.gen=$("#gn").value;S.step=2;render()}}
else{P.quiz=P.quiz||{};const rq=P.gen=="girl"?"Your relationship with your mother":"Your relationship with your father";
a.innerHTML=`<h2>${t("q")}</h2>${[...QZ,[rq,REL]].map((q,i)=>`<div class="card"><b class="sans">${i+1}. ${q[0]}</b>${q[1].map(o=>`<button class="opt ${S.q[i]==o?"sel":""}" data-i="${i}" data-o="${esc(o)}">${o}</button>`).join("")}</div>`).join("")}<div class="card"><label>${t("wk")}</label><textarea id="wk" rows="4">${esc(P.week||"")}</textarea></div><button id="fn">${t("nx")}</button>`;
a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.q[b.dataset.i]=b.dataset.o;a.querySelectorAll(`[data-i="${b.dataset.i}"]`).forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
$("#fn").onclick=()=>{P.quiz=Object.fromEntries(QZ.map((q,i)=>[q[0],S.q[i]||"-"]));P.rel=S.q[QZ.length]||"-";P.week=$("#wk").value;P.done=1;P.prog={};save();render()}}}
function dash(a){const tabs=[["hi",t("hi")],["su",t("su")],["co",t("co")],["pl",t("pl")],["ye",t("ye")]];
a.innerHTML=`<div class="tabs">${tabs.map(x=>`<button class="${S.tab==x[0]?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join("")}</div><div id="v"></div>`;
a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.ch=null;dash(a)});
const v=$("#v");({hi:H,su:SU,co:CO,pl:PL,ye:YE})[S.tab](v)}
function H(v){const d=Math.max(0,Math.ceil((new Date("2027-06-03")-new Date())/864e5));const n=Object.keys(P.prog||{}).length;
v.innerHTML=`<h2>${t("hello")}, ${esc(P.name)} ✦</h2><div class="card"><div style="font-size:42px;font-weight:800" class="sans">${d}</div><div class="mut">${t("left")}</div></div><div class="grid"><div class="card"><b class="sans">${P.level} · ${SN[P.sec]}</b><p class="mut">${Object.keys(SEC[P.sec]).length} ${t("su")} · ${n} ${t("ch")} ✔</p><div class="bar"><i style="width:${Math.min(100,n*5)}%"></i></div></div><div class="card"><b class="sans">${t("ph")}</b><p class="mut">“${["Know thyself.","Doubt is the beginning of wisdom.","Habit is second nature."][new Date().getDate()%3]}”</p></div></div>${P.weak?`<div class="card"><b class="sans">Focus</b><p>${esc(P.weak)}</p></div>`:""}<div class="card"><b class="sans">🧠 Brain profile</b><div id="bp" style="white-space:pre-wrap">${esc(P.brain||"")}</div><br><button class="g" id="bb">${P.brain?"Refresh":"Build"} my brain profile</button></div><div class="card"><b class="sans">Daily check-in</b><br><br><select id="md"><option>😀 Great</option><option>😐 Okay</option><option>😴 Tired</option><option>😰 Stressed</option></select><br><br><button class="g" id="mb">Get today’s mission</button><div id="mo" style="white-space:pre-wrap;margin-top:10px"></div></div><button id="g1">${t("su")} →</button>`;$("#g1").onclick=()=>{S.tab="su";dash($("#app"))};$("#bb").onclick=async()=>{$("#bp").textContent=t("load");const r=await ai(`${ctx()} Write this student's brain profile: learning strengths, risks (sleep, stress, focus), the 4 best study techniques for him with how-to, 3 daily habits, and one honest sentence of encouragement. Max 220 words, plain text.`);P.brain=r||"";save();$("#bp").textContent=r||t("nf")};$("#mb").onclick=async()=>{const o=$("#mo");o.textContent=t("load");const r=await ai(`${ctx()} Today's mood: ${$("#md").value}. Progress: ${JSON.stringify(P.prog)}. Give today's mission: 3 steps, max 90 minutes total, adapted to mood, prioritising weak chapters and spaced review, plus one 2-minute brain-reset exercise. Short plain text.`);o.textContent=r||t("nf")}}
function SU(v){if(S.ch)return CH(v);const subs=SEC[P.sec];
v.innerHTML=Object.entries(subs).map(([s,c])=>`<h3>${s}</h3><div class="grid">${c.map(x=>`<div class="card chap" data-s="${esc(s)}" data-c="${esc(x)}"><b class="sans">${esc(x)}</b><div class="mut sans" style="font-size:13px">${(P.prog||{})[s+x]?"✔ ":""}${t("pt")} → ${t("fl")} → PDF</div></div>`).join("")}</div>`).join("");
v.querySelectorAll(".chap").forEach(c=>c.onclick=()=>{S.ch={s:c.dataset.s,c:c.dataset.c};S.qs=null;S.ans={};S.res=null;dash($("#app"));S.tab="su"})}
async function CH(v){const{s,c}=S.ch;
v.innerHTML=`<button class="g" id="bk">← ${t("bk")}</button><h2>${esc(s)} · ${esc(c)}</h2><div id="cb"></div>`;$("#bk").onclick=()=>{S.ch=null;dash($("#app"));S.tab="su"};
const cb=$("#cb");
if(!S.qs){cb.innerHTML=`<div class="card"><button id="rn">${t("run")}</button></div>`;$("#rn").onclick=async()=>{cb.innerHTML=`<div class="card">${t("load")}</div>`;
const r=await ai(`${ctx()} Create a 6-question multiple-choice pre-test for the Tunisian ${P.level} ${SN[P.sec]} chapter "${c}" of subject "${s}", ordered from easy to hard. Return ONLY JSON: {"qs":[{"q":"","o":["","","",""],"a":0,"topic":""}]} (a = index of correct option).`,1);
if(!r||!r.qs){cb.innerHTML=`<div class="card">${t("nf")}</div>`;return}S.qs=r.qs;CH(v)}}
else if(!S.res){cb.innerHTML=S.qs.map((q,i)=>`<div class="card"><span class="tag">${i<2?"easy":i<4?"medium":"hard"}</span> <b>${esc(q.q)}</b>${q.o.map((o,j)=>`<button class="opt ${S.ans[i]===j?"sel":""}" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join("")}</div>`).join("")+`<button id="fi">${t("fin")}</button>`;
cb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[b.dataset.i]=+b.dataset.j;cb.querySelectorAll(`[data-i="${b.dataset.i}"]`).forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
$("#fi").onclick=async()=>{cb.innerHTML=`<div class="card">${t("load")}</div>`;
const rs=S.qs.map((q,i)=>({q:q.q,topic:q.topic,correct:S.ans[i]===q.a}));
const r=await ai(`${ctx()} Results of the pre-test on "${c}" (${s}): ${JSON.stringify(rs)}. Return ONLY JSON: {"score":"x/6","weak":["..."],"analysis":"short","course":"adaptive mini-course (max 350 words) that focuses on the weak points, plain text with short numbered sections and worked examples","cards":[{"f":"question","b":"answer"}] (8 flashcards),"summary":"one-page printable summary with key formulas/definitions, plain text"}`,1);
if(!r){cb.innerHTML=`<div class="card">${t("nf")}</div>`;return}
S.res=r;P.prog[s+c]=r.score;P.weak=(r.weak||[]).join(", ");save();CH(v)}}
else{const r=S.res;S.fc=S.fc||0;const k=r.cards||[];
cb.innerHTML=`<div class="card"><span class="tag">${esc(r.score)}</span><p>${esc(r.analysis)}</p><b class="sans">Weak points:</b> ${esc((r.weak||[]).join(", "))}</div><div class="card"><div style="white-space:pre-wrap">${esc(r.course)}</div></div>
<h3>${t("fl")}</h3><div class="fc" id="fc"><div></div></div><p class="sans"><button class="g" id="pv">‹</button> <span id="ct"></span> <button class="g" id="nt">›</button></p><button id="dl">${t("dl")}</button> <button class="g" id="vs">🎬 ${t("vd")}</button><div id="vo" class="card hid" style="white-space:pre-wrap"></div>`;
let side=0;const sh=()=>{const c=k[S.fc]||{f:"-",b:"-"};$("#fc div").textContent=side?c.b:c.f;$("#fc div").style.background=side?"var(--card)":"var(--bg)";$("#ct").textContent=(S.fc+1)+"/"+k.length};
$("#fc").onclick=()=>{side^=1;sh()};$("#pv").onclick=()=>{S.fc=(S.fc+k.length-1)%k.length;side=0;sh()};$("#nt").onclick=()=>{S.fc=(S.fc+1)%k.length;side=0;sh()};sh();
$("#vs").onclick=async()=>{const o=$("#vo");o.classList.remove("hid");o.textContent=t("load");const x=await ai(`${ctx()} Write a complete video script (max 10 minutes, about 1300 spoken words) teaching "${c}" (${s}) for a Tunisian ${P.level} ${SN[P.sec]} student, adapted to his weak points (${P.weak||"none yet"}). Use timestamps: 0:00 hook, simple concept with a daily-life analogy, 2-3 worked examples from easy to hard, common exam traps, 60-second recap, 3 practice questions. Add [visual] and [on-screen text] cues. Plain text.`);o.textContent=x||t("nf")};$("#dl").onclick=async()=>{const h=`<!DOCTYPE html><meta charset=utf-8><title>${esc(c)}</title><style>body{font:15px/1.6 Georgia;max-width:760px;margin:30px auto;color:#14213d}h1{color:#4f46e5;border-bottom:3px solid #f59e0b}.b{background:#f6f7fb;border-left:4px solid #4f46e5;padding:10px 14px;margin:12px 0;white-space:pre-wrap}.f{display:inline-block;width:46%;border:1px dashed #4f46e5;padding:8px;margin:4px;vertical-align:top}@media print{@page{margin:14mm}}</style><h1>${esc(s)} — ${esc(c)}</h1><div class=b>${esc(r.summary)}</div><h2>Flashcards</h2>${k.map(x=>`<div class=f><b>${esc(x.f)}</b><br>${esc(x.b)}</div>`).join("")}<script>window.onload=()=>{}<\/script>`;
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download=c.replace(/\W+/g,"_")+".html";a.click()}}}
function CO(v){v.innerHTML=`<div id="ch">${S.chat.map(m=>`<div class="msg ${m.role=="user"?"u":"a"}">${esc(m.content)}</div>`).join("")}</div><div style="display:flex;gap:8px"><input id="in" placeholder="${t("ask")}"><button id="sd" style="width:110px">${t("send")}</button></div>`;
const go=async()=>{const x=$("#in").value.trim();if(!x)return;S.chat.push({role:"user",content:x});S.chat.push({role:"assistant",content:t("load")});CO(v);
const hist=[{role:"user",content:ctx()+"\n\nConversation so far follows. Answer the last user message."},{role:"assistant",content:"Understood."},...S.chat.slice(0,-1)];
const r=await ai(hist);S.chat[S.chat.length-1].content=r||t("nf");CO(v)};$("#sd").onclick=go;$("#in").onkeydown=e=>{if(e.key=="Enter")go()}}
function PL(v){v.innerHTML=`<div class="card"><p>${esc(P.week||"")}</p><button id="gp">${t("gp")}</button></div><div id="pp" class="card" style="white-space:pre-wrap;${P.plan?"":"display:none"}">${esc(P.plan||"")}</div>`;
$("#gp").onclick=async()=>{$("#pp").style.display="block";$("#pp").textContent=t("load");const r=await ai(`${ctx()} Build a realistic 7-day study plan from the student's week description, respecting school, sport and rest. Prioritise weak points (${P.weak||"unknown yet"}), spaced repetition, sleep. Plain text, one line per time block.`);P.plan=r||t("nf");save();$("#pp").textContent=P.plan}}
function YE(v){v.innerHTML=`<div class="card">${esc(t("yr"))}</div>`}
S.lang=P.lang||"en";document.documentElement.dir=S.lang=="ar"?"rtl":"ltr";render();
